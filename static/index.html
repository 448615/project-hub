<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5B8CFF" />
  <title>项目枢纽 · 桌面</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/static/icons/app-512.png" />
  <link rel="apple-touch-icon" href="/static/icons/app-512.png" />
  <!-- 样式按功能分层（static/css/），link 顺序 = 层叠顺序，勿调换 -->
  <link rel="stylesheet" href="/static/css/00-base.css" />
  <link rel="stylesheet" href="/static/css/10-desktop.css" />
  <link rel="stylesheet" href="/static/css/11-window.css" />
  <link rel="stylesheet" href="/static/css/12-taskbar.css" />
  <link rel="stylesheet" href="/static/css/13-menu.css" />
  <link rel="stylesheet" href="/static/css/20-viewers.css" />
  <link rel="stylesheet" href="/static/css/21-preview.css" />
  <link rel="stylesheet" href="/static/css/22-shell.css" />
  <link rel="stylesheet" href="/static/css/30-features.css" />
  <link rel="stylesheet" href="/static/css/40-account.css" />
  <link rel="stylesheet" href="/static/css/50-subapp.css" />
  <!-- v56：原「云端数据」面板用的第三方云 SDK 及其配置脚本已下线删除（全仓无调用方），
       页面现在不含任何第三方脚本，SRI 哈希也就不需要再跟着升级维护。 -->
</head>
<body>
  <!-- 桌面：背景图之上是这一层，用来摆放子项目图标 -->
  <div id="desktop">
    <div id="icons"></div>     <!-- 子项目图标会被 JS 填到这里，像 Windows 桌面图标 -->
  </div>

  <!-- 窗口层：双击图标后弹出的玻璃窗口都挂在这里 -->
  <div id="windows"></div>

  <!-- 底部任务栏：开始按钮 + 搜索 + 窗口按钮，右边时钟/音量（关机移入开始菜单） -->
  <div id="taskbar">
    <button id="startBtn" title="开始" aria-label="开始">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="3" width="8.5" height="8.5" rx="1.6" fill="#5B8CFF"/>
        <rect x="12.5" y="3" width="8.5" height="8.5" rx="1.6" fill="#67E8F9"/>
        <rect x="3" y="12.5" width="8.5" height="8.5" rx="1.6" fill="#67E8F9"/>
        <rect x="12.5" y="12.5" width="8.5" height="8.5" rx="1.6" fill="#5B8CFF"/>
      </svg>
    </button>
    <button id="searchBtn" title="搜索子项目（Ctrl+K）">🔍</button>
    <button id="termBtn" data-admin-only title="打开终端" aria-label="终端">⬛</button>
    <button id="taskviewBtn" title="任务视图（Ctrl+Alt+V）" aria-label="任务视图">🗗</button>
    <div id="taskItems"></div>
    <div class="tb-right">
      <!-- 当前登录用户：邮箱 + 角色徽标 + 退出（未登录时整条隐藏） -->
      <div id="userChip" class="user-chip" hidden>
        <span id="userEmail" class="user-email" title=""></span>
        <span id="userRole" class="user-role"></span>
        <button id="btnLogout" class="user-logout" title="退出登录">退出</button>
      </div>
      <!-- 通知中心：有未读消息时图标上显示红点，点击弹列表面板 -->
      <button id="notifBtn" class="notif-btn" title="通知中心" aria-label="通知中心">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
        <span id="notifDot" class="notif-dot" hidden></span>
      </button>
      <div id="notifPanel" class="notif-panel" hidden>
        <div class="np-head"><span>通知中心</span><button id="notifClear" title="清空">🗑 全部清除</button></div>
        <div id="notifList" class="np-list"><div class="np-empty">暂无通知</div></div>
      </div>
      <!-- 音量控制：时间左边的声音大小图标，hover 弹滑块，点击静音 -->
      <div id="volume" class="vol">
        <!-- 喇叭按钮：点一下静音/取消静音；鼠标移入时下方弹出滑块 -->
        <!-- 用矢量 SVG 喇叭（和关机标 ⏻ 同款单色线性图标，不受 emoji 配色影响、放大不糊）；
             #volGlyph 内部由 JS 按“静音/小声/大声”三种状态填入不同波形 -->
        <button id="volBtn" class="vol-btn" title="点击静音/取消静音，移入调音量" aria-label="音量">
          <svg id="volIco" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g id="volGlyph"></g>
          </svg>
        </button>
        <!-- 音量弹窗：默认 hidden 隐藏，鼠标移入音量区域才显示 -->
        <div id="volPopup" class="vol-popup" hidden>
          <!-- 滑块：0~100，初始 80 -->
          <input id="volSlider" type="range" min="0" max="100" value="80" />
          <!-- 显示当前百分比 -->
          <span id="volVal" class="vol-val">80%</span>
        </div>
      </div>
      <div id="clock"></div>
    </div>
  </div>

  <!-- 提示条 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 全局快速启动 / 搜索（Ctrl+K 唤起）：玻璃遮罩 + 搜索框 + 结果列表 -->
  <div id="launcher" class="launcher" hidden>
    <div class="launcher-box">
      <input id="launcherInput" class="launcher-input" placeholder="搜索子项目 / 标签 / 描述…（Enter 打开，Esc 关闭）" />
      <ul id="launcherList" class="launcher-list"></ul>
    </div>
  </div>

  <!-- 桌面右键菜单（仿 Windows：空白/图标/窗口 三类） -->
  <div id="ctxmenu" class="ctxmenu" hidden></div>

  <!-- 右下角时间 → 小日历 -->
  <div id="cal" class="cal" hidden></div>

  <!-- 锁屏/开机画面：加载时覆盖全屏，点击任意处进入桌面 -->
  <div id="lockscreen">
    <div class="lock-time" id="lockTime">--:--</div>
    <div class="lock-date" id="lockDate"></div>
    <div class="lock-hint">✦ 点击任意位置进入桌面 ✦</div>
  </div>

  <!-- 登录遮罩：未登录时覆盖全屏。支持「登录 / 注册」双模式可切换。
       背景直接复用桌面壁纸（CSS 变量 --wallpaper，见 00-base.css 的 body::before），
       盖一层 .login-scrim 保证文字可读——这样开屏与进入桌面后是同一张壁纸，视觉连续。
       层级高于锁屏：登录通过后锁屏流程照旧。 -->
  <div id="loginVeil" class="login-veil" hidden>
    <div class="login-scrim" aria-hidden="true"></div>

    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">🏠</div>
        <div class="login-title">项目枢纽</div>
        <div class="login-sub">把散落的子项目，收进一个桌面</div>
      </div>

      <!-- 模式切换：登录 / 注册 -->
      <div id="authTabs" class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">登录</button>
        <button id="tabRegister" class="auth-tab" type="button">注册</button>
      </div>

      <!-- 登录模式：邮箱 + 密码 -->
      <form id="loginForm" class="auth-form" autocomplete="on">
        <input id="loginEmail" class="login-input" type="email" placeholder="邮箱" autocomplete="email" />
        <div class="pwd-wrap">
          <input id="loginPassword" class="login-input" type="password" placeholder="密码" autocomplete="current-password" />
          <button class="pwd-eye" type="button" data-eye="loginPassword" aria-label="显示密码" aria-pressed="false">
            <span aria-hidden="true">👁</span>
          </button>
        </div>
        <button id="btnLogin" class="login-btn login-btn-primary" type="submit">
          <span class="btn-label">登录</span><span class="btn-spin" aria-hidden="true"></span>
        </button>
        <div class="auth-switch">
          <a href="#" id="forgotPwd">忘记密码？</a>
          <span class="auth-switch-sep">·</span>
          <a href="#" id="switchToRegister">去注册</a>
        </div>
      </form>

      <!-- 注册模式：邮箱 + 邮箱验证码 + 密码（本地账号，首个注册者自动成为管理员）
           验证码是「这个邮箱是你的」的唯一证明：图形码只证明「这是人」，
           邮件码才证明「邮箱属于你」。所以发信前必须先过图形码——发信是最贵、
           也是唯一能打扰到别人的动作。 -->
      <form id="registerForm" class="auth-form" hidden autocomplete="on">
        <input id="regEmail" class="login-input" type="email" placeholder="邮箱" autocomplete="email" />
        <!-- 图形验证码：图片来自 GET /api/captcha（免登录接口），点击图片即可换一张。
             令牌是一次性的，任何一次失败后都必须换图，所以「图片可点」不是装饰，
             是失败后的唯一出路。 -->
        <div class="cap-row">
          <input id="regCaptcha" class="login-input cap-input" type="text" placeholder="图形验证码"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 maxlength="4" aria-label="图形验证码" />
          <button id="captchaBox" class="cap-box" type="button" title="看不清？点击换一张"
                  aria-label="图形验证码，点击更换">
            <span class="cap-loading">加载中…</span>
          </button>
        </div>
        <div class="code-row">
          <input id="regCode" class="login-input" type="text" placeholder="邮件验证码"
                 inputmode="numeric" autocomplete="one-time-code" spellcheck="false"
                 maxlength="8" aria-label="邮件验证码" />
          <button id="btnSendCode" class="code-btn" type="button">发送验证码</button>
        </div>
        <div class="pwd-wrap">
          <input id="regPassword" class="login-input" type="password" placeholder="设置密码（≥6 位）" autocomplete="new-password" />
          <button class="pwd-eye" type="button" data-eye="regPassword" aria-label="显示密码" aria-pressed="false">
            <span aria-hidden="true">👁</span>
          </button>
        </div>
        <div class="pwd-wrap">
          <input id="regPassword2" class="login-input" type="password" placeholder="确认密码" autocomplete="new-password" />
          <button class="pwd-eye" type="button" data-eye="regPassword2" aria-label="显示密码" aria-pressed="false">
            <span aria-hidden="true">👁</span>
          </button>
        </div>
        <button id="btnRegister" class="login-btn login-btn-primary" type="submit">
          <span class="btn-label">注册</span><span class="btn-spin" aria-hidden="true"></span>
        </button>
        <div class="auth-switch">已有账号？<a href="#" id="switchToLogin">去登录</a></div>
      </form>

      <!-- 找回密码：邮箱 → 图形码 → 邮件码 → 新密码
           为什么必须有邮件码：图形码只能证明「这是人」，证明不了「这个邮箱是你的」。
           少了邮件码这一步，任何知道你邮箱的人都能把密码改掉。 -->
      <form id="resetForm" class="auth-form" hidden autocomplete="on">
        <input id="resetEmail" class="login-input" type="email" placeholder="注册时用的邮箱" autocomplete="email" />
        <div class="cap-row">
          <input id="resetCaptcha" class="login-input cap-input" type="text" placeholder="图形验证码"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 maxlength="4" aria-label="图形验证码" />
          <button id="resetCaptchaBox" class="cap-box" type="button" title="看不清？点击换一张"
                  aria-label="图形验证码，点击更换">
            <span class="cap-loading">加载中…</span>
          </button>
        </div>
        <div class="code-row">
          <input id="resetCode" class="login-input" type="text" placeholder="邮件验证码"
                 inputmode="numeric" autocomplete="one-time-code" spellcheck="false"
                 maxlength="8" aria-label="邮件验证码" />
          <button id="btnResetCode" class="code-btn" type="button">发送验证码</button>
        </div>
        <div class="pwd-wrap">
          <input id="resetPassword" class="login-input" type="password" placeholder="新密码（≥6 位）" autocomplete="new-password" />
          <button class="pwd-eye" type="button" data-eye="resetPassword" aria-label="显示密码" aria-pressed="false">
            <span aria-hidden="true">👁</span>
          </button>
        </div>
        <div class="pwd-wrap">
          <input id="resetPassword2" class="login-input" type="password" placeholder="确认新密码" autocomplete="new-password" />
          <button class="pwd-eye" type="button" data-eye="resetPassword2" aria-label="显示密码" aria-pressed="false">
            <span aria-hidden="true">👁</span>
          </button>
        </div>
        <button id="btnReset" class="login-btn login-btn-primary" type="submit">
          <span class="btn-label">重设密码</span><span class="btn-spin" aria-hidden="true"></span>
        </button>
        <div class="auth-switch"><a href="#" id="switchToLoginFromReset">返回登录</a></div>
      </form>

      <div id="loginMsg" class="login-msg" role="status" aria-live="polite"></div>
      <!-- 只陈述数据放在哪，不做「不会被谁看到」之类的承诺：
           本地库、浏览器本地、云端密文副本是三种不同归宿，一句笼统的
           「不会上传」在开了云同步的用户那里就是假话。
           注册时邮箱会交给平台邮件服务投递验证码，这一点也必须明说。 -->
      <div class="login-tip">账号存本机数据库 · 注册时邮箱仅用于发送验证码 · 工作台数据存本浏览器本地</div>
    </div>

    <!-- 右下角访客入口：只读公开项目卡片，任何操作都引导登录 -->
    <button id="guestEnter" class="guest-enter" type="button">
      <span class="guest-enter-dot" aria-hidden="true"></span>访客模式 · 浏览公开内容
    </button>
  </div>

  <!-- 访客视图：未登录时只读展示脱敏后的项目卡片（数据源 /api/public/projects）。
       刻意不进入完整桌面——桌面的每个窗口都依赖已登录才能取的接口，
       半登录状态下点哪里都是 401，不如给一个明确边界：能看，不能动。 -->
  <div id="guestView" class="guest-view" hidden>
    <div class="guest-bar">
      <div class="guest-bar-title">
        <span class="guest-badge">访客</span>
        <span id="guestTitle">项目枢纽</span>
      </div>
      <div class="guest-bar-actions">
        <span id="guestSubtitle" class="guest-subtitle"></span>
        <button id="guestLoginBtn" class="guest-login-btn" type="button">登录 / 注册</button>
      </div>
    </div>
    <div id="guestGrid" class="guest-grid" aria-live="polite"></div>
    <div class="guest-foot">访客只能浏览项目说明；文档、文件、终端与应用均需登录后使用。</div>
  </div>


  <!-- 桌面应用逻辑：服务端按 static/js/bundle.order 的顺序把下面这些文件合并成
       一个响应（/static/js/bundle.js），31 个请求变 1 个。
       源码仍然是 static/js/ 下的独立文件，改完刷新即生效，不需要任何构建步骤；
       新增文件记得登记进 bundle.order（漏登记时启动会打告警）。 -->
  <script src="/static/js/bundle.js"></script>
</body>
</html>
